ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = ["no.java.cupcake.ApplicationKt.module"]
  }
}

sleepingpill {
  base = ${?SP_BASE_URL}
  username = ${?SP_USER}
  password = ${?SP_PASSWORD}
  # Conference data is close to static; refreshes run in the background, so a long TTL only limits upstream reads
  cache_ttl_seconds = 21600
  cache_ttl_seconds = ${?SP_CACHE_TTL_SECONDS}
  max_past_years = 3
}

bring {
  username = ${?BRING_API_USER}
  api_key = ${?BRING_API_KEY}
  postalcodes_url = "https://api.bring.com/address/api/NO/postal-codes"
  # Postal codes change a handful of times a year
  refresh_hours = 24
  refresh_hours = ${?BRING_REFRESH_HOURS}
}

oidc {
  # The javaBin internal Cognito pool, so local runs log in the same way as prod. Discovery is fetched
  # at startup even with jwt.enabled = false.
  well_known_url = "https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_Icikv3dtD/.well-known/openid-configuration"
  well_known_url = ${?OIDC_WELL_KNOWN_URL}
}

jwt {
  enabled = true
  enabled = ${?JWT_ENABLED}
}