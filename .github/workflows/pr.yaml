name: PR Check Backend

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: ./gradlew check

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            **/build/reports/
            **/build/test-results/
